apiVersion: v1
kind: Pod
metadata:
  name: cloud-gaming-session-01
  namespace: default
  annotations:
    # Explicitly activate HAMi Graphics Mode (Vulkan Layer + Driver Capabilities)
    hami.io/graphics-mode: "enabled"
    # Route OpenGL games/tools through Mesa Zink to enforce budgets through Vulkan
    hami.io/enable-zink: "true"
    # Ensure Vulkan ICD points to NVIDIA discrete card (essential on hybrid laptops like RTX 3060)
    hami.io/vulkan-icd: "/usr/share/vulkan/icd.d/nvidia_icd.json"
spec:
  restartPolicy: OnFailure
  containers:
  - name: game-streamer
    image: games-on-whales/wolf:latest # Example modern cloud-gaming container with Sunshine/Moonlight + Proton/Wine
    resources:
      limits:
        # 1. CPU allocation
        cpu: "4"
        # 2. System RAM allocation
        memory: "8Gi"
        # 3. GPU Slicing Criteria (Standard unified nvidia.com resources)
        nvidia.com/gpu: "1"        # Request 1 virtual GPU slice
        nvidia.com/gpumem: "4096"  # Cap VRAM to 4096 MiB (enforced by HAMi Vulkan Layer)
        nvidia.com/gpucores: "50"  # Cap GPU compute to 50% (enforced via time-slicing)
      requests:
        cpu: "2"
        memory: "4Gi"
        nvidia.com/gpu: "1"
        nvidia.com/gpumem: "4096"
        nvidia.com/gpucores: "50"
    env:
      # NVIDIA Container Toolkit capabilities (also auto-injected by HAMi webhook)
      - name: NVIDIA_DRIVER_CAPABILITIES
        value: "compute,utility,graphics,display"
      # Vulkan ICD pinning
      - name: VK_ICD_FILENAMES
        value: "/usr/share/vulkan/icd.d/nvidia_icd.json"
      # DXVK HUD for real-time monitoring of FPS, VRAM allocation, and D3D calls
      - name: DXVK_HUD
        value: "fps,memory,gpuload"
      # Audio / display configuration for streaming
      - name: PULSE_SERVER
        value: "tcp:127.0.0.1:4713"
      - name: DISPLAY
        value: ":99"
    securityContext:
      privileged: false
      capabilities:
        add:
          - SYS_NICE # Recommended for stable frame presentation and low latency
